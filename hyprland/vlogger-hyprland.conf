# ==============================================================================
# VLOGGER HYPRLAND INTEGRATION CONFIGURATION
# ==============================================================================
# Add this file to your Hyprland configuration or source it:
#   source = ~/.config/hypr/vlogger.conf
# ==============================================================================

# 1. Window Rules: Keep vlogger floating, centered, and neatly sized in Kitty
windowrulev2 = float, class:^(vlogger)$
windowrulev2 = size 850 520, class:^(vlogger)$
windowrulev2 = center, class:^(vlogger)$
windowrulev2 = dimaround, class:^(vlogger)$

# 2. Keybindings:
# Open/toggle the interactive Vim-powered TUI:
bind = $mainMod, T, exec, kitty --class vlogger -e vlogger

# Instant background Start/Stop toggle (without opening the window):
bind = $mainMod SHIFT, T, exec, vlogger toggle
